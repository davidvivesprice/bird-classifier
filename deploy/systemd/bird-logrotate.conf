# User-space logrotate config for the bird observatory's flat logs.
# Run by bird-logrotate.timer (daily) as:
#   logrotate --state ~/.local/state/bird-logrotate.state <this file>
#
# The four service logs are legacy: units now log to journald (persistent,
# capped at 500M). These rules keep any still-append-mode process bounded
# until its next restart, and cover anything else that lands in ~/logs.
# copytruncate is REQUIRED for the service logs — systemd holds an O_APPEND
# fd, so rename-rotation would keep writes going to the rotated file.
# Truncation is safe: O_APPEND fds always write at the (new) EOF.

/home/vives/logs/bird-pipeline.log
/home/vives/logs/bird-dashboard.log
/home/vives/logs/go2rtc.log
/home/vives/logs/cloudflared.log {
    size 20M
    rotate 4
    compress
    copytruncate
    missingok
    notifempty
}

# Thermal CSV: written by a per-minute oneshot (no long-held fd), so plain
# rename-rotation is fine — the next sample recreates the file with a header.
/home/vives/logs/pi5-thermal-watch.csv {
    monthly
    rotate 12
    compress
    dateext
    missingok
    notifempty
}

# Alert history from bird-alert@.service.
/home/vives/logs/unit-failures.log {
    size 1M
    rotate 4
    compress
    missingok
    notifempty
}
