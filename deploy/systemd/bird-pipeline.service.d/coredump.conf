# F4 SEGV capture (2026-06-28): keep core dumps armed for bird-pipeline.
# LimitCORE=infinity is now ALSO baked into bird-pipeline.service itself, so
# this drop-in is redundant belt-and-braces — kept in the repo because the
# live Pi has it installed at ~/.config/systemd/user/bird-pipeline.service.d/
# and a repo redeploy must never disarm F4.
[Service]
LimitCORE=infinity
